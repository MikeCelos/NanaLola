services:
  - type: web
    name: nanowrimo-cozy-app
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 10000
      # Conexão com Supabase ou Neon (PostgreSQL na Nuvem)
      # Basta configurar a variável DATABASE_URL ou SPRING_DATASOURCE_URL no painel do Render!
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

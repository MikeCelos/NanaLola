services:
  - type: web
    name: nanowrimo-cozy-app
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: 10000
      # Cloud PostgreSQL connection (Neon / Supabase / Railway)
      # Configure this variable in the Render Dashboard -> Environment tab for 100% free permanent persistence!
      - key: DATABASE_URL
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

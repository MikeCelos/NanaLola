# Server Port
server.port=${PORT:8080}

# Application Name
spring.application.name=nanowrimo-app

# Default Local Database (H2 file-based persistence: saves into data/nanowrimo_db so local data is NOT lost on restart)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/nanowrimo_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# H2 Console (available locally at /h2-console for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Static content caching for PWA
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
